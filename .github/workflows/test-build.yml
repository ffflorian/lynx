name: Build and Release

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint and build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn --immutable

      - name: Lint
        run: yarn lint

      - name: Check compiled CSS is up to date
        run: |
          yarn build
          git diff --exit-code assets/css/compiled/main.css

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: '0.168.0'

      - name: Build example site
        working-directory: ./exampleSite
        run: hugo --minify --themesDir ../.. --baseURL https://jpanther.github.io/lynx/

  release:
    name: Publish Release
    needs: build
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
          cache: yarn

      - name: Install dependencies
        run: yarn --immutable

      - name: Publish release to GitHub
        env:
          GIT_AUTHOR_NAME: Florian Imdahl
          GIT_AUTHOR_EMAIL: git@ffflorian.de
          GIT_COMMITTER_NAME: Florian Imdahl
          GIT_COMMITTER_EMAIL: git@ffflorian.de
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn release
