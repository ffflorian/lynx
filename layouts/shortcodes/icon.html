{{/* Usage: {{< icon "github" >}} (decorative) or {{< icon "github" "GitHub" >}} (with alt text)
*/}}
{{ $alt := $.Get 1 }}
<span
  class="icon relative inline-block align-text-bottom"
  {{ with $alt }}
    role="img" aria-label="{{ . }}"
  {{ else }}
    aria-hidden="true"
  {{ end }}
>
  {{ $icon := resources.Get (printf "icons/%s.svg" ($.Get 0)) }}
  {{ if $icon }}
    {{ $icon.Content | safeHTML }}
  {{ else }}
    <em>{{ i18n "shortcode.icon_none" }}</em>
  {{ end }}
</span>
