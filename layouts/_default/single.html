{{ define "main" }}
  <article class="mt-10 flex flex-col items-center justify-center">
    <nav class="place-self-start" aria-label="{{ i18n "a11y.breadcrumb" }}">
      <a href="{{ "" | relURL }}" class="text-neutral-500 dark:text-neutral-400"
        ><span aria-hidden="true">&larr;</span> {{ i18n "nav.home" }}</a
      >
    </nav>
    <header>
      <h1 class="mb-6 mt-2 text-center text-4xl font-extrabold text-neutral-800 dark:text-white">
        {{ .Title | emojify }}
      </h1>
    </header>
    <section class="prose dark:prose-invert">
      {{ .Content | emojify }}
    </section>
  </article>
{{ end }}
